name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Copy the latest tutor pages into the apps
        run: |
          cp index.html android/app/src/shakai/assets/index.html
          cp bubba/index.html android/app/src/bubba/assets/index.html
      - name: Build both APKs
        working-directory: android
        run: gradle assembleShakaiDebug assembleBubbaDebug --no-daemon
      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/shakai/debug/app-shakai-debug.apk Zulu1-HamDog-Tutor.apk
          cp android/app/build/outputs/apk/bubba/debug/app-bubba-debug.apk Zulu1-Tutor-Bubba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zulu1-Tutor-apks
          path: "*.apk"
      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Zulu 1 Tutor Android ${{ github.run_number }}
          files: |
            Zulu1-HamDog-Tutor.apk
            Zulu1-Tutor-Bubba.apk
