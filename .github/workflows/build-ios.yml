name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Copy the latest tutor pages into the apps
        run: |
          cp index.html ios/Resources/Shakai/index.html
          cp bubba/index.html ios/Resources/Bubba/index.html
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build both apps (unsigned)
        run: |
          for t in Zulu1Tutor Zulu1Bubba; do
            xcodebuild -project ios/Zulu1Tutor.xcodeproj -scheme "$t" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          done
      - name: Package IPAs
        run: |
          pack() { rm -rf Payload && mkdir Payload && cp -R "build/Build/Products/Release-iphoneos/$1.app" Payload/ && zip -qry "$2" Payload; }
          pack Zulu1Tutor Zulu1-HamDog-Tutor.ipa
          pack Zulu1Bubba Zulu1-Tutor-Bubba.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Zulu1-Tutor-ipas
          path: "*.ipa"
      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.1.${{ github.run_number }}
          name: Zulu 1 Tutor iPhone ${{ github.run_number }}
          files: |
            Zulu1-HamDog-Tutor.ipa
            Zulu1-Tutor-Bubba.ipa
